function wrapNote(text,width,limit){
 const lines=[];
 let line='';
 for(const word of text.trim().split(/\s+/u)){
  const candidate=line?line+' '+word:word;
  if(width(candidate)<=limit){line=candidate;continue}

  line='';
  for(const ch of word){

function noise(d,f,v,loop=false){let buf=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(loop?1:Math.sin(Math.PI*i/a.length));let s=ctx.createBufferSource(),g=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=f;s.buffer=buf;s.loop=loop;g.gain.value=v;s.connect(filter).connect(g).connect(ctx.destination);s.start()}
function tone(f,v,d){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.65,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ctx.destination);o.start();o.stop(t+d)}
